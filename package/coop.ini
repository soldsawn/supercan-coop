[coop]
; steam = internet uzerinden (Steam arkadas listesi, iki tarafta Steam acik); udp = yalnizca yerel ag
net=steam
; Bu bilgisayarin dinledigi UDP portu
listen=27015
; Karsi bilgisayarin IPv4 adresi:port, ornek peer=192.168.1.100:27015
; Bos birakilirsa yerel agda yayinla karsi tarafi kendisi bulur (iki tarafta da bos olabilir).
peer=
; full = cercevesiz tam ekran pencere (varsayilan, onerilen); off = oyunun kendi tam ekrani; x,y,genislik,yukseklik = tek PC test penceresi
window=full
